<!doctype html>
<html lang="ko">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiNote · 공통 필기 시험</title>
<link rel="stylesheet" href="style.css">
<body>
<header><div><span class="brand">MiNote <span>LAB</span></span><h1>공통 필기 왕복 검증</h1><p>다른 편집기에서도, 같은 기록.</p></div>
<div class="file-actions"><button id="sample">샘플 열기</button><label class="button">JSON 열기<input id="file" type="file" accept=".json,application/json"></label><button id="download" class="primary" disabled>JSON 다운로드</button></div></header>
<main><aside>
<div class="eyebrow">DOCUMENT</div><h2 id="title">문서를 열어 주세요</h2><p id="summary">파일은 기기 안에서만 처리합니다.</p>
<label>페이지<select id="page" disabled></select></label>
<label>선택할 획<select id="stroke" disabled></select></label>
<div class="movement"><label>가로 이동 (pt)<input id="dx" type="number" value="12" step="1"></label><label>세로 이동 (pt)<input id="dy" type="number" value="-8" step="1"></label></div>
<button id="move" disabled>선택한 획 이동</button><button id="delete" class="danger" disabled>선택한 획 삭제</button>
<hr><button id="pen" disabled aria-pressed="false">새 펜으로 그리기</button>
<label>화면 확대<input id="zoom" type="range" min="0.5" max="2" step="0.1" value="1"><output id="zoom-value">100%</output></label>
<p class="notice">기본 획의 모양은 근사합니다. PDF 배경은 표시하지 않으며 원본 페이지 정보는 유지합니다.</p>
<p id="status" role="status" aria-live="polite">샘플 또는 JSON 문서를 열어 시작하세요.</p>
</aside><section class="workspace"><div class="canvas-heading"><span id="page-label">EMPTY PAGE</span><span>좌상단 원점 · 72pt/in</span></div><div id="stage"><canvas id="canvas" aria-label="공통 필기 페이지"></canvas><div id="empty">기록을 이어갈 준비가 되었습니다.<small>샘플 열기에서 시작할 수 있습니다.</small></div></div></section></main>
<section id="export-panel" hidden><label for="export-json">편집한 JSON 출력</label><textarea id="export-json" readonly spellcheck="false"></textarea></section>
<footer>독립 시험 편집기 · 원본 JSON과 PDF 자산을 덮어쓰지 않습니다.</footer>
<script type="module" src="app.mjs"></script>
</body></html>
